services:
  tosma_app_v2:
    restart: always
    build: .
    ports:
      - "8084:3000"
    depends_on:
      - tosma_db_v2
    env_file:
      - .env
    environment:
      - AUTH_TRUST_HOST=true
      - HOSTNAME=0.0.0.0
      - DB_HOST=tosma_db_v2
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=tosma
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: sh -c "pnpm start"

  tosma_db_v2:
    image: mariadb:10.11
    restart: always
    environment:
      # Injecte les identifiants pour l'initialisation de MariaDB
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tosma
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8085:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: