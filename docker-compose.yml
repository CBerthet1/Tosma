version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-dev
    restart: always  # ← Redémarre automatiquement
    environment:
      MYSQL_ROOT_PASSWORD: tertor
      MYSQL_DATABASE: db_site
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
